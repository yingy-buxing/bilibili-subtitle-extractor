<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>B站字幕提取</title><style>
body{width:390px;margin:0;padding:22px;box-sizing:border-box;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#263143;background:#fafbfc}h1{font-size:22px;margin:0 0 8px}h2{font-size:16px;margin:14px 0;overflow-wrap:anywhere}p{margin:8px 0;color:#596779}button{padding:10px 14px;border:0;border-radius:8px;background:#2563eb;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.5}#extract{width:100%;margin-top:12px}.row{display:flex;gap:8px;margin:12px 0}input,select{box-sizing:border-box;width:100%;font:inherit;border:1px solid #cdd5df;border-radius:7px;padding:8px}label{display:block;margin:10px 0 5px}pre{max-height:150px;overflow:auto;white-space:pre-wrap;padding:10px;background:#f0f3f7;font:13px/1.7 inherit;border-radius:8px}#status{white-space:pre-wrap}[hidden]{display:none!important}.small{font-size:12px}</style></head><body>
<h1>B站字幕提取</h1><p>使用当前视频页已登录的账号，提取平台已有字幕。</p><button id="extract">提取当前视频字幕</button><p id="status" role="status" aria-live="polite">在B站视频页点击上方按钮。</p>
<section id="result" hidden><h2 id="title"></h2><label for="track">字幕语言</label><select id="track"></select><p id="stats"></p><label for="name">文件名</label><input id="name"><div class="row"><button data-format="txt">下载TXT</button><button data-format="srt">下载SRT</button><button data-format="json">JSON</button></div><pre id="preview"></pre></section>
<p class="small">无需重新登录，无需开发者工具。不读取Cookie，不上传字幕。AI字幕的错字会原样保留。</p>
<script src="core.js"></script><script src="page-extract.js"></script><script src="popup.js"></script></body></html>
